complexity:
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false
  LongMethod:
    threshold: 90
    ignoreAnnotated: [ "Composable" ]
  CyclomaticComplexMethod:
    ignoreAnnotated: [ "Composable" ]
  ComplexCondition:
    active: true
    threshold: 5

naming:
  MatchingDeclarationName:
    active: false
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'
  FunctionNaming:
    active: true
    functionPattern: '^[a-z][A-Za-z0-9]*$'
    ignoreAnnotated: [ "Composable" ]

formatting:
  Indentation:
    active: false
  ImportOrdering:
    active: false
  Filename:
    active: false
  MaximumLineLength:
    active: true
    maxLineLength: 166
    ignoreImports: true

style:
  MaxLineLength:
    active: true
    maxLineLength: 166
    excludeImportStatements: true
  MagicNumber:
    active: false
  ReturnCount:
    active: true
    max: 4
  DestructuringDeclarationWithTooManyEntries:
    active: true
    maxDestructuringEntries: 6
