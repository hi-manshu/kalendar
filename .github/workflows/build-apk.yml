name: Build Sample APK

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'img/**'
      - 'LICENSE.txt'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'img/**'
      - 'LICENSE.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :sample:assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find sample/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found under sample/build/outputs/apk"
            find sample/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK ($(du -h "$APK" | cut -f1))"

      - name: Rename APK for artifact
        id: named
        run: |
          SRC="${{ steps.apk.outputs.path }}"
          OUT="sample/build/outputs/apk/kalendar-sample-debug-${GITHUB_SHA::7}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$OUT")" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kalendar-sample-debug-${{ github.sha }}
          path: ${{ steps.named.outputs.path }}
          if-no-files-found: error
          retention-days: 30
