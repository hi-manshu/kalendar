name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Detekt + desktop tests + compile (JVM/Wasm/Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Detekt
        run: ./gradlew detekt --stacktrace

      - name: Desktop unit + UI tests
        run: |
          ./gradlew \
            :kalendar:desktopTest \
            :kalendar-foundation:desktopTest \
            :kalendar-sync:desktopTest \
            --stacktrace

      - name: Compile library desktop targets
        run: |
          ./gradlew \
            :kalendar:compileKotlinDesktop \
            :kalendar-foundation:compileKotlinDesktop \
            :kalendar-sync:compileKotlinDesktop \
            --stacktrace

      - name: Compile library Wasm JS targets
        run: |
          ./gradlew \
            :kalendar:compileKotlinWasmJs \
            :kalendar-foundation:compileKotlinWasmJs \
            :kalendar-sync:compileKotlinWasmJs \
            --stacktrace

      - name: Compile library Android debug
        run: |
          ./gradlew \
            :kalendar:compileDebugKotlinAndroid \
            :kalendar-foundation:compileDebugKotlinAndroid \
            :kalendar-sync:compileDebugKotlinAndroid \
            --stacktrace

      - name: Upload Detekt SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-sarif
          path: |
            **/build/reports/detekt/detekt.sarif
          if-no-files-found: ignore
          retention-days: 14

  ios:
    name: Compile iOS simulator targets
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile iOS simulator arm64 (libraries)
        run: |
          ./gradlew \
            :kalendar:compileKotlinIosSimulatorArm64 \
            :kalendar-foundation:compileKotlinIosSimulatorArm64 \
            :kalendar-sync:compileKotlinIosSimulatorArm64 \
            --stacktrace
