name: Check Code - Detekt

# Prefer the unified CI workflow (ci.yml). Kept for manual/ad-hoc Detekt runs.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  code-quality:
    name: Detekt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Detekt
        run: ./gradlew detekt --stacktrace

      - name: Upload Detekt SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-sarif
          path: |
            **/build/reports/detekt/detekt.sarif
          if-no-files-found: ignore
          retention-days: 14
